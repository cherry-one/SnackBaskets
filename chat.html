<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSITM 부트캠프 10기 최종 결과</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="chat.css" />

    <script>
        const tableData = [
            { rank: 1, name: '포카칩', vote: '70%', comment: '+3', barWidth: '70%' },
            { rank: 2, name: '홈런볼', vote: '50%', comment: '', barWidth: '50%' },
            { rank: 3, name: '초코파이', vote: '30%', comment: '', barWidth: '30%' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const tbody = document.getElementById('table-body');

            tableData.forEach(row => {
                const tr = document.createElement('tr');

                const tdRank = document.createElement('td');
                tdRank.textContent = row.rank;

                const tdName = document.createElement('td');
                tdName.innerHTML = row.name;

                if (row.comment) {
                    const more = document.createElement('span');
                    more.className = 'more';
                    more.textContent = ` ${row.comment}`;
                    tdName.appendChild(more);
                }

                const tdVote = document.createElement('td');
                tdVote.innerHTML = `
                    
                    <div class="bar">
                        <div class="fill" style="width: ${row.barWidth}">
                            <span>${row.vote}</span>
                        </div>
                    </div>
                    `;
                    

                tr.appendChild(tdRank);
                tr.appendChild(tdName);
                tr.appendChild(tdVote);
                tbody.appendChild(tr);
            });
        });
    </script>

</head>

<body>
    <header>
        <h2 style="margin: 0px;">GSITM 부트캠프 10기 최종 결과</h2>
        <div class="user-tools">
            <a href="index.html" class="user-icon"><i class="fa-solid fa-circle-user"></i></a>
            <a href="#" class="login"><img src="/img/kakaotalk.png" alt="카카오 로그인" /></a>
        </div>
    </header>

    <a href="index.html"><img src="/img/arrow.png" class="arrow"></a>

    <div class="main-content">
        <h3>투표 최종 결과</h3>
        <div class="snack">선정 부식</div>

        <table class="scroll-table">
            <thead>
                <tr>
                    <th>순위</th>
                    <th>제품명</th>
                    <th>투표율</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>

        <div class="total">총계: ₩ 42,400</div>

        <div class="chat-box">
            <div class="input-row">
                <input type="text" placeholder="이름" />
                <input type="password" placeholder="비밀번호" />
            </div>
            <div class="chat-entry">
                <span class="chat-x">&#10006;</span>
                <span class="chat-bubble">눈의 솔을 마시고 싶어요…</span>
            </div>
            <div class="chat-entry chat-right">
                <span class="chat-bubble chat-bubble-right">그건 좀….</span>
            </div>
            <form>
                <input class="message-input" type="text" placeholder="메시지를 입력 하십시오" />
                <button type="submit" class="send-btn">전송</button>
            </form>
        </div>

        <div class="register">
            <a href="index.html" class="select-btn">확인</a>
        </div>
    
    </div>
</body>

</html>
