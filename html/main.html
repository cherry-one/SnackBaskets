<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSITM 부트캠프 부식 신청</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script>
        // 카카오계정로그인
        Kakao.init('589be75a091dfe592e704844287e451a'); // 본인 JavaScript 키 사용

        function loginWithKakao() {
            Kakao.Auth.login({
                success: function (authObj) {
                    Kakao.API.request({
                        url: '/v2/user/me',
                        success: function (res) {
                            alert(res.kakao_account.email + "님 환영합니다!");
                            // 이후 페이지 이동 또는 사용자 정보 저장 처리
                        },
                        fail: function (error) {
                            console.error(error);
                        }
                    });
                },
                fail: function (err) {
                    alert("로그인 실패: " + JSON.stringify(err));
                }
            });
        }
    </script>
</head>

<body>
    <header>
        <h2>GSITM 부트캠프 10기 부식 신청</h2>
        <div class="user-tools">
            <a href="/html/manage.html" class="user-icon"><i class="fa-solid fa-circle-user"></i></a>
            <a href="" class="login" onclick="loginWithKakao()"><img src="/img/kakaotalk.png" alt="카카오 로그인" /></a>
        </div>
    </header>

    <div class="info-bar">
        <p>부식 등록 기간: 00.00 ~ 00.00 / 투표 기간: 00.00 ~ 00.00</p>
    </div>

    <div class="main-content">
        <div class="graph">
            <h3>실시간 투표 그래프</h3>
            <div class="bar-graph">
                <div class="bar-label">예감</div>
                <div class="bar">
                    <div class="fill color1" style="width: 60%"><span>60%</span></div>
                </div>
                <div class="bar-label">포카칩</div>
                <div class="bar">
                    <div class="fill color2" style="width: 30%"><span>30%</span></div>
                </div>
                <div class="bar-label">햇반</div>
                <div class="bar">
                    <div class="fill color3" style="width: 50%"><span>50%</span></div>
                </div>
            </div>

            <h3>카테고리별 비율</h3>
            <div class="pie"></div>

            <div class="legend">
                <div class="legend-item">
                    <span class="pie-box color1"></span>
                    <span class="label-text">스낵류</span>
                </div>
                <div class="legend-item">
                    <span class="pie-box color2"></span>
                    <span class="label-text">음료류</span>
                </div>
                <div class="legend-item">
                    <span class="pie-box color3"></span>
                    <span class="label-text">그 외</span>
                </div>
            </div>
        </div>

        <!-- 우측 패널 -->
        <div class="side-panel">
            <section class="panel">
                <a href="/html/serch.html" class="register-btn">부식 등록</a>
                <a href="/html/vote.html" class="vote-btn">투표하기</a>
            </section>

            <!-- 리스트 iframe 삽입 -->
            <section class="select-panel">
                <iframe src="/html/selectlist.html" title="부식선정리스트" class="select-frame"></iframe>
            </section>
        </div>
    </div>
</body>

</html>
