<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>부식 등록</title>
<link rel="stylesheet" href="serch.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <header>
        <h2 style="margin: 0px;">GSITM 부트캠프 10기 부식 등록</h2>
        <div class="user-tools">
            <a href="index.html" class="user-icon"><i class="fa-solid fa-circle-user"></i></a>
            <a href="#" class="login"><img src="/img/kakaotalk.png" alt="카카오 로그인" /></a>
        </div>
    </header>

    <div class="info-bar">
        <p>부식 등록 기간: 00.00 ~ 00.00 / 투표 기간: 00.00 ~ 00.00</p>
    </div>

    <a href="index.html">
        <img src="/img/arrow.png" class="arrow">
    </a>
    

    <main class="main-content">
        <h3 style="justify-self: center;">부식 등록</h3>
    <div class="search-box">
        <input type="text" autofocus placeholder="검색어 입력" >
        <button>🔍</button>
    </div>

    
    <div class="product-chat-box">
        <h4>추가할 부식 menu</h4>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox"  />제품명</th>
                            <th>가격</th>
                            <th>호소하기</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="checkbox" checked /> 예감</td>
                            <td>4000</td>
                            <td>먹어보고 싶어요</td>
                        </tr>
                        <tr>
                            <td colspan="3" style="height: 200px;"></td>
                        </tr>
                        
                    </tbody>
                </table>
            </div>
        <div class="chat-input">
            <input type="text" placeholder="의견을 입력하세요" />
            <button >전송</button>
        </div>
    </div>


    <div class="register">
        <a href="index.html" class="select-btn">등록</a>
    </div>

</div>
</body>
</html>
